<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/latest/pydide.css" />
    <style>
      body { background-color: #000000; color: white; }
      html, body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <script>
      const processedIds = new Set();

      function tryDispatch() {
        try {
          const rawData = localStorage.getItem('myAppData');
          if (!rawData) return;

          const data = JSON.parse(rawData);
          const {
            ID,
            payload,
            "passcode token": passcodeToken,
            "run?": runStatus
          } = data;

          const shouldRun = runStatus === true || runStatus === 'true';

          if (ID && shouldRun && !processedIds.has(ID)) {
            processedIds.add(ID);

            if (window.executePythonPayload) {
              window.executePythonPayload(ID, payload, passcodeToken);
            } else {
              console.warn('Python payload handler is not ready yet.');
            }
          }
        } catch (error) {
          console.error('Error in tryDispatch:', error);
        }
      }

      window.addEventListener('py:ready', () => {
        setInterval(tryDispatch, 100);
      });
    </script>

    <script type="py">
      import sys

# Block dangerous modules before they can be imported
blocked_modules = {
    'os', 'subprocess', 'sys', 'importlib', 'eval', 'exec',
    '__import__', 'compile', 'open', 'input', '__builtins__'
}

# Remove from sys.modules to prevent imports
for module in blocked_modules:
    if module in sys.modules:
        del sys.modules[module]
      from js import window
      from pyodide import create_proxy

      def my_python_execution(id, payload, token):
          try:
              exec(payload)
          except Exception as e:
              print(f"Error executing payload: {e}")

      window.executePythonPayload = create_proxy(my_python_execution)
    </script>
  </body>
</html>

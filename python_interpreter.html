<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/latest/pydide.css" />
    <style>
      body { background-color: #000000; color: white; }
      html, body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <script>
      const processedIds = new Set();

      setInterval(() => {
        try {
          const rawData = localStorage.getItem('myAppData');
          if (!rawData) return;

          const data = JSON.parse(rawData);
          const {
            ID,
            payload,
            "passcode token": passcodeToken,
            "run?": runStatus
          } = data;

          const shouldRun = runStatus === true || runStatus === 'true';

          if (ID && shouldRun && !processedIds.has(ID)) {
            processedIds.add(ID);
            executePayload(ID, payload, passcodeToken);
          }
        } catch (error) {
          // Ignore malformed/incomplete data while writing
        }
      }, 50);

      function executePayload(id, payload, token) {
        if (window && window.executePythonPayload) {
          try {
            window.executePythonPayload(id, payload, token);
          } catch (error) {
            console.error('Failed to call Python payload handler:', error);
          }
        } else {
          console.warn('Python payload handler is not ready yet.');
        }
      }
    </script>

    <script type="py">
      from js import window
      from pyodide import create_proxy

      def my_python_execution(id, payload, token):
          print(f"Python payload triggered for id={id}, token={token}, payload={payload}")

      window.executePythonPayload = create_proxy(my_python_execution)
    </script>
  </body>
</html>
